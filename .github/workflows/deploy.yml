name: allverse ai deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: aws configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push redis if changed
        env:
          UPSTREAM_TAG: ${{ vars.REDIS_IMAGE_TAG || '7' }}
        run: |
          set -euo pipefail
          HASH=$( { cat images/redis/Dockerfile; printf 'upstream=redis:%s\n' "$UPSTREAM_TAG"; } | sha256sum | cut -c1-12 )
          echo "REDIS_HASH=$HASH" >> "$GITHUB_ENV"
          if aws ecr describe-images --repository-name redis --image-ids imageTag="$HASH" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "redis:$HASH already in ECR, skipping"
          else
            docker build --build-arg REDIS_UPSTREAM_TAG="$UPSTREAM_TAG" -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/redis:$HASH" images/redis
            docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/redis:$HASH"
          fi

      - name: Build and push mongodb if changed
        env:
          UPSTREAM_TAG: ${{ vars.MONGODB_IMAGE_TAG || '7' }}
        run: |
          set -euo pipefail
          HASH=$( { cat images/mongodb/Dockerfile; printf 'upstream=mongo:%s\n' "$UPSTREAM_TAG"; } | sha256sum | cut -c1-12 )
          echo "MONGODB_HASH=$HASH" >> "$GITHUB_ENV"
          if aws ecr describe-images --repository-name mongodb --image-ids imageTag="$HASH" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "mongodb:$HASH already in ECR, skipping"
          else
            docker build --build-arg MONGODB_UPSTREAM_TAG="$UPSTREAM_TAG" -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/mongodb:$HASH" images/mongodb
            docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/mongodb:$HASH"
          fi

      - name: Build and push qdrant if changed
        env:
          UPSTREAM_TAG: ${{ vars.QDRANT_IMAGE_TAG || 'latest' }}
        run: |
          set -euo pipefail
          HASH=$( { cat images/qdrant/Dockerfile; printf 'upstream=qdrant/qdrant:%s\n' "$UPSTREAM_TAG"; } | sha256sum | cut -c1-12 )
          echo "QDRANT_HASH=$HASH" >> "$GITHUB_ENV"
          if aws ecr describe-images --repository-name qdrant --image-ids imageTag="$HASH" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "qdrant:$HASH already in ECR, skipping"
          else
            docker build --build-arg QDRANT_UPSTREAM_TAG="$UPSTREAM_TAG" -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/qdrant:$HASH" images/qdrant
            docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/qdrant:$HASH"
          fi

      - name: Build and push ollama if changed
        env:
          UPSTREAM_TAG: ${{ vars.OLLAMA_IMAGE_TAG || 'latest' }}
        run: |
          set -euo pipefail
          HASH=$( { cat images/ollama/Dockerfile; printf 'upstream=ollama/ollama:%s\n' "$UPSTREAM_TAG"; } | sha256sum | cut -c1-12 )
          echo "OLLAMA_HASH=$HASH" >> "$GITHUB_ENV"
          if aws ecr describe-images --repository-name ollama --image-ids imageTag="$HASH" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "ollama:$HASH already in ECR, skipping"
          else
            docker build --build-arg OLLAMA_UPSTREAM_TAG="$UPSTREAM_TAG" -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ollama:$HASH" images/ollama
            docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/ollama:$HASH"
          fi

      - name: Build and push litellm if changed
        env:
          UPSTREAM_TAG: ${{ vars.LITELLM_UPSTREAM_TAG || 'main-latest' }}
        run: |
          set -euo pipefail
          HASH=$( { find images/litellm -type f -print0 | sort -z | xargs -0 sha256sum; printf 'base=%s\n' "$UPSTREAM_TAG"; } | sha256sum | cut -c1-12 )
          echo "LITELLM_HASH=$HASH" >> "$GITHUB_ENV"
          if aws ecr describe-images --repository-name litellm --image-ids imageTag="$HASH" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "litellm:$HASH already in ECR, skipping"
          else
            docker build --build-arg LITELLM_BASE_IMAGE="ghcr.io/berriai/litellm:$UPSTREAM_TAG" -f images/litellm/Dockerfile -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/litellm:$HASH" images/litellm
            docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/litellm:$HASH"
          fi

  deploy-backend:
    needs: deploy-infrastructure
    if: ${{ always() && (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: aws configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Gateway
        run: |
          docker build -f backend/gateway/Dockerfile -t gateway backend
          docker tag gateway:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      - name: Build Auth
        run: |
          docker build -f backend/services/auth/Dockerfile -t auth-service backend
          docker tag auth-service:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      - name: Build Chat
        run: |
          docker build -f backend/services/chat/Dockerfile -t chat-service backend
          docker tag chat-service:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      - name: Build agent
        run: |
          docker build -f backend/services/agent/Dockerfile -t agent-service backend/services/agent
          docker tag agent-service:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      - name: Build billing
        run: |
          docker build -f backend/services/billing/Dockerfile -t billing-service backend
          docker tag billing-service:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      - name: Force new deployment on application services
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
        run: |
          for svc in ${{ secrets.GATEWAY_SERVICE }} ${{ secrets.AUTH_SERVICE }} ${{ secrets.CHAT_SERVICE }} ${{ secrets.AGENT_SERVICE }} ${{ secrets.BILLING_SERVICE }}; do
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$svc" --force-new-deployment --region "$AWS_REGION" >/dev/null
          done
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services ${{ secrets.GATEWAY_SERVICE }} ${{ secrets.AUTH_SERVICE }} ${{ secrets.CHAT_SERVICE }} ${{ secrets.AGENT_SERVICE }} ${{ secrets.BILLING_SERVICE }} --region "$AWS_REGION"

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: build frontend
        env:
          VITE_SERVER_URL: ${{ vars.GATEWAY_PUBLIC_URL }}
          VITE_ALLOW_DEV_LOGIN: 'false'
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ vars.RAZORPAY_KEY_ID }}
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "GATEWAY_PUBLIC_URL repository variable is required for production builds." >&2
            exit 1
          fi
          cd frontend
          npm install
          npm run build

      - name: aws configure
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: upload to s3
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.S3_BUCKET }} --delete

      - name: invalidate cloudfront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
