model_list:
  # ── Single Local Ollama Model (llama3.2:3b) ───────────────────────
  # All agent roles route to this one installed model so the project
  # works with a single Ollama download.
  - model_name: llama3.2:3b
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://host.docker.internal:11434

  # ── Generic Aliases (all mapped to llama3.2:3b) ───────────────────
  - model_name: allverse-chat
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://host.docker.internal:11434

  - model_name: allverse-coding
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://host.docker.internal:11434

  - model_name: allverse-vision
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://host.docker.internal:11434

router_settings:
  routing_strategy: "simple-shuffle"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
