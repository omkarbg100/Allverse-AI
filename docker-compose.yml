services:
  # ── 1. Redis (in-memory for now) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: allverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - allverse-net

  s3mock:
    image: adobe/s3mock:latest
    container_name: allverse-s3
    restart: unless-stopped
    environment:
      initialBuckets: agent-files
    ports:
      - "9000:9090"
    networks:
      - allverse-net

  # ── 2. LiteLLM Unified Gateway (proxies to Groq) ─────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: allverse-litellm
    restart: unless-stopped
    ports:
      - "4001:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-allverse-litellm-master-key}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    networks:
      - allverse-net

  # ── 3. Node.js Backend Microservices ──────────────────────────
  auth:
    build:
      context: ./backend
      dockerfile: ./services/auth/Dockerfile
    container_name: allverse-auth
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    environment:
      - PORT=8001
      - REDIS_URL=redis://redis:6379
      - ALLOW_DEV_LOGIN=${ALLOW_DEV_LOGIN:-false}
    depends_on:
      - redis
    networks:
      - allverse-net

  chat:
    build:
      context: ./backend
      dockerfile: ./services/chat/Dockerfile
    container_name: allverse-chat
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ./.env
    environment:
      - PORT=8002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - allverse-net

  billing:
    build:
      context: ./backend
      dockerfile: ./services/billing/Dockerfile
    container_name: allverse-billing
    restart: unless-stopped
    ports:
      - "8004:8004"
    env_file:
      - ./.env
    environment:
      - PORT=8004
      - REDIS_URL=redis://redis:6379
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_secret_placeholder}
    depends_on:
      - redis
    networks:
      - allverse-net

  # ── 4. Python AI Service (FastAPI + LangGraph) ─────────────────
  agent:
    build:
      context: ./backend/services/agent
      dockerfile: Dockerfile
    container_name: allverse-agent
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - ./.env
    environment:
      - PORT=8003
      - LITELLM_URL=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY:-sk-allverse-litellm-master-key}
      - USE_LITELLM=true
      - REDIS_URL=redis://redis:6379
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    volumes:
      - fastembed-cache:/app/.cache/fastembed
    depends_on:
      - litellm
      - redis
      - s3mock
    networks:
      - allverse-net

  # ── 5. Gateway (Reverse Proxy / API Router) ────────────────────
  gateway:
    build:
      context: ./backend
      dockerfile: ./gateway/Dockerfile
    container_name: allverse-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - PORT=8000
      - FRONTEND_URL=http://localhost:5173
      - AUTH_SERVICE=http://auth:8001
      - CHAT_SERVICE=http://chat:8002
      - AGENT_SERVICE=http://agent:8003
      - BILLING_SERVICE=http://billing:8004
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - auth
      - chat
      - billing
      - agent
    networks:
      - allverse-net

  # ── 6. Frontend (React + Vite + Tailwind + Beacon UI) ──────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: allverse-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_SERVER_URL=http://localhost:8000
      - VITE_ALLOW_DEV_LOGIN=${ALLOW_DEV_LOGIN:-false}
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
    depends_on:
      - gateway
    networks:
      - allverse-net

networks:
  allverse-net:
    driver: bridge

volumes:
  fastembed-cache:
