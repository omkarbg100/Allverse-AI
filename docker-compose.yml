services:
  # ── 1. Databases & Infrastructure ─────────────────────────────
  mongodb:
    image: mongo:7
    container_name: allverse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - allverse-net

  redis:
    image: redis:7-alpine
    container_name: allverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - allverse-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: allverse-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - allverse-net

  s3mock:
    image: adobe/s3mock:latest
    container_name: allverse-s3
    restart: unless-stopped
    environment:
      initialBuckets: agent-files
    ports:
      - "9000:9090"
    networks:
      - allverse-net

   # ── 2. LLM Provider: Groq (external API, no container) ──────────
   # Groq is called directly by the agent service via GROQ_API_KEY.

  # ── 3. Node.js Backend Microservices ──────────────────────────
  auth:
    build:
      context: ./backend
      dockerfile: ./services/auth/Dockerfile
    container_name: allverse-auth
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./backend/services/auth/.env
    environment:
      - PORT=8001
      - MONGODB_URI=mongodb://mongodb:27017/allverse_ai
      - REDIS_URL=redis://redis:6379
      - ALLOW_DEV_LOGIN=${ALLOW_DEV_LOGIN:-false}
    depends_on:
      - mongodb
      - redis
    networks:
      - allverse-net

  chat:
    build:
      context: ./backend
      dockerfile: ./services/chat/Dockerfile
    container_name: allverse-chat
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ./backend/services/chat/.env
    environment:
      - PORT=8002
      - MONGODB_URI=mongodb://mongodb:27017/allverse_ai
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - allverse-net

  billing:
    build:
      context: ./backend
      dockerfile: ./services/billing/Dockerfile
    container_name: allverse-billing
    restart: unless-stopped
    ports:
      - "8004:8004"
    env_file:
      - ./backend/services/billing/.env
    environment:
      - PORT=8004
      - MONGODB_URI=mongodb://mongodb:27017/allverse_ai
      - REDIS_URL=redis://redis:6379
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_secret_placeholder}
    depends_on:
      - mongodb
      - redis
    networks:
      - allverse-net

  # ── 4. Python AI Service (FastAPI + LangGraph) ─────────────────
  agent:
    build:
      context: ./backend/services/agent
      dockerfile: Dockerfile
    container_name: allverse-agent
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - ./backend/services/agent/.env
    environment:
      - PORT=8003
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongodb:27017/allverse_ai
      - AUTH_SERVICE=http://auth:8001
      - CHAT_SERVICE=http://chat:8002
      - MINIO_ENDPOINT=http://s3mock:9090
      - S3_PUBLIC_ENDPOINT=http://localhost:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_KEY=minioadmin
      - AWS_BUCKET_NAME=agent-files
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    volumes:
      - fastembed-cache:/app/.cache/fastembed
    depends_on:
      - redis
      - qdrant
      - s3mock
    networks:
      - allverse-net

  # ── 5. Gateway (Reverse Proxy / API Router) ────────────────────
  gateway:
    build:
      context: ./backend
      dockerfile: ./gateway/Dockerfile
    container_name: allverse-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/gateway/.env
    environment:
      - PORT=8000
      - FRONTEND_URL=http://localhost:5173
      - AUTH_SERVICE=http://auth:8001
      - CHAT_SERVICE=http://chat:8002
      - AGENT_SERVICE=http://agent:8003
      - BILLING_SERVICE=http://billing:8004
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - auth
      - chat
      - billing
      - agent
    networks:
      - allverse-net

  # ── 6. Frontend (React + Vite + Tailwind + Beacon UI) ──────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: allverse-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_SERVER_URL=http://localhost:8000
      - VITE_ALLOW_DEV_LOGIN=${ALLOW_DEV_LOGIN:-false}
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
    depends_on:
      - gateway
    networks:
      - allverse-net

networks:
  allverse-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  qdrant-data:
  fastembed-cache:
