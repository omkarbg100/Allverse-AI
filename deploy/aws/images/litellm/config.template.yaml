model_list:
  - model_name: ${OLLAMA_MODEL}
    litellm_params:
      model: ollama/${OLLAMA_MODEL}
      api_base: ${OLLAMA_API_BASE}

  - model_name: allverse-chat
    litellm_params:
      model: ollama/${OLLAMA_MODEL}
      api_base: ${OLLAMA_API_BASE}

  - model_name: allverse-coding
    litellm_params:
      model: ollama/${OLLAMA_MODEL}
      api_base: ${OLLAMA_API_BASE}

  - model_name: allverse-vision
    litellm_params:
      model: ollama/${OLLAMA_MODEL}
      api_base: ${OLLAMA_API_BASE}

router_settings:
  routing_strategy: "simple-shuffle"

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
