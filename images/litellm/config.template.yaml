model_list:
  - model_name: ${GROQ_CHAT_MODEL}
    litellm_params:
      model: groq/${GROQ_CHAT_MODEL}
      api_key: os.environ/GROQ_API_KEY

  - model_name: allverse-chat
    litellm_params:
      model: groq/${GROQ_CHAT_MODEL}
      api_key: os.environ/GROQ_API_KEY

  - model_name: allverse-coding
    litellm_params:
      model: groq/${GROQ_CHAT_MODEL}
      api_key: os.environ/GROQ_API_KEY

  - model_name: allverse-vision
    litellm_params:
      model: groq/${GROQ_VISION_MODEL}
      api_key: os.environ/GROQ_API_KEY

router_settings:
  routing_strategy: "simple-shuffle"

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
