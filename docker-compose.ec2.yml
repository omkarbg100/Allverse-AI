# Production overrides for a single EC2 host.
# Usage: docker compose -f docker-compose.yml -f docker-compose.ec2.yml up -d --build
services:
  frontend:
    environment:
      - VITE_SERVER_URL=${GATEWAY_PUBLIC_URL:-http://localhost:8000}
      - VITE_ALLOW_DEV_LOGIN=${ALLOW_DEV_LOGIN:-false}
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
  gateway:
    environment:
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
  nginx:
    image: nginx:1.27-alpine
    container_name: allverse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/ec2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ec2/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - gateway
    networks:
      - allverse-net
